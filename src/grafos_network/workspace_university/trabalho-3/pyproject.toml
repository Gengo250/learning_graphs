[project]
name = "terraria-network-analysis"
version = "0.1.0"
description = "Ambiente para análise de redes do Terraria em Jupyter Notebook."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
]
